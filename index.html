<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><text y='14' font-size='15'>🛰️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme, resolved before the first paint.

         This has to be inline, synchronous, and above everything that paints.
         Read the preference from the bundle instead and the page lands in the
         default theme, paints, and only then flips — the flash every themed
         site is judged by.

         It writes a literal light/dark rather than leaving "system" implicit,
         so the stylesheet declares the palette once instead of once for
         [data-theme] and again for a prefers-color-scheme query. React
         re-stamps this if the OS preference changes while the tab is open.

         localStorage throws outright in some privacy modes, so the whole thing
         is wrapped: a visitor who blocks storage still gets a themed page. -->
    <script>
      (function () {
        var el = document.documentElement
        try {
          var saved = localStorage.getItem('theme')
          el.dataset.theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
        } catch (e) {
          el.dataset.theme = 'dark'
        }
      })()
    </script>
    <!-- Colours the browser chrome on mobile. Kept in step by the toggle,
         since a media query here could not follow a manual choice. -->
    <meta name="theme-color" content="#050505" />

    <!-- SEO + social meta + JSON-LD: GENERATED from src/data/profile.ts at build time
         (see vite.config.ts → htmlHeadMeta plugin). Do not edit by hand. -->
    <!--app-head-meta-->

    <!-- Static SEO -->
    <meta name="robots" content="index, follow" />

    <!-- Agent-facing alternates: point AI agents at the machine-readable entry points -->
    <link rel="alternate" type="text/markdown" href="/SKILL.md" title="Agent skill file" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM index" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- The contributions grid and the release tags are fetched as soon as the
         app mounts, and both paid for a cold DNS + TLS handshake first. Warming
         the connections here overlaps that with parsing the bundle. dns-prefetch
         rather than preconnect: these are fetched a moment after paint, not
         during it, so a full handshake would compete with the font for the
         browser's early-connection budget. -->
    <link rel="dns-prefetch" href="https://github-contributions-api.jogruber.de">
    <link rel="dns-prefetch" href="https://api.github.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:34rem;margin:4rem auto;padding:0 1.5rem;color:#8c8c8c;font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;line-height:1.6">
        <p style="color:#c6c6c6;font-size:1.125rem;font-weight:600">This site needs JavaScript.</p>
        <p>If you would rather not turn it on, everything here is also readable as plain files:
          <a style="color:#9c9c9c" href="/resume.json">resume.json</a>,
          <a style="color:#9c9c9c" href="/llms.txt">llms.txt</a> and
          <a style="color:#9c9c9c" href="/SKILL.md">SKILL.md</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
